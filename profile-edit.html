<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit profile | NeighbourNest</title>
  <link rel="stylesheet" href="fahim.css">
  <script src="shared/data.js" defer></script>
  <script src="shared/common.js" defer></script>
  <script src="profile-edit.js" defer></script>
</head>
<body data-page="profile-edit" data-module="FAHIM">
<div class="app-shell">
  <p class="demo-notice">Interactive frontend demo · Sample data only · FAHIM module</p>
  <header class="topbar">
    <a class="brand" href="index.html">Neighbour<span>Nest</span></a>
    <span class="community">Greenview Community</span>
    <span class="user">Resident</span>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <nav aria-label="Main navigation">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="login.html">Log in</a>
        <a class="nav-link" href="register.html">Register</a>
        <a class="nav-link active" href="profile.html" aria-current="page">Profile</a>
      </nav>
      <div class="sidebar-bottom">
        <span>Greenview, Dhaka</span>
        <a href="index.html">Module home</a>
      </div>
    </aside>
    <main class="main">
      <header class="page-title">
        <h1>Manage your account</h1>
      </header>
      <section class="panel form-panel">
        <form id="profileForm" novalidate>
          <div class="form-group">
            <label for="name">Full name</label>
            <input id="name" type="text" placeholder="Your full name" aria-describedby="nameError">
            <span class="error" id="nameError" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label for="building">Building or block</label>
            <input id="building" type="text" placeholder="e.g. Block A" aria-describedby="buildingError">
            <span class="error" id="buildingError" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="asha@example.com" aria-describedby="emailError">
            <span class="error" id="emailError" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label for="currentPassword">Current password</label>
            <input id="currentPassword" type="password" placeholder="" aria-describedby="currentPasswordError">
            <span class="error" id="currentPasswordError" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" placeholder="" aria-describedby="newPasswordError">
            <span class="error" id="newPasswordError" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label for="confirm">Confirm new password</label>
            <input id="confirm" type="password" placeholder="" aria-describedby="confirmError">
            <span class="error" id="confirmError" aria-live="polite"></span>
          </div>
          <p class="note">Leave password fields empty to keep your current password.</p>
          <div class="actions">
            <button class="btn" type="submit">Save changes</button>
            <a class="btn secondary" href="profile.html">Cancel</a>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
