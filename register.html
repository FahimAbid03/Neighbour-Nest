<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | NeighbourNest</title>
  <link rel="stylesheet" href="fahim.css">
  <script src="shared/data.js" defer></script>
  <script src="shared/common.js" defer></script>
  <script src="register.js" defer></script>
</head>
<body data-page="register" data-module="FAHIM">
<main class="public">
  <div class="public-brand">
    <a class="brand" href="index.html">Neighbour<span>Nest</span></a>
    <span class="tagline">Your neighbourhood, together.</span>
  </div>
  <div class="leaf one" aria-hidden="true"></div>
  <div class="leaf two" aria-hidden="true"></div>
  <section class="public-card">
    <h1>Join NeighbourNest</h1>
    <p class="subtitle">Create your resident account.</p>
    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="Your full name" aria-describedby="nameError">
        <span class="error" id="nameError" aria-live="polite"></span>
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="asha@example.com" aria-describedby="emailError">
        <span class="error" id="emailError" aria-live="polite"></span>
      </div>
      <div class="form-group">
        <label for="building">Building or block</label>
        <input id="building" type="text" placeholder="e.g. Block A" aria-describedby="buildingError">
        <span class="error" id="buildingError" aria-live="polite"></span>
      </div>
      <div class="two">
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="At least 8 characters" aria-describedby="passwordError">
          <span class="error" id="passwordError" aria-live="polite"></span>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" placeholder="Repeat password" aria-describedby="confirmError">
          <span class="error" id="confirmError" aria-live="polite"></span>
        </div>
      </div>
      <button class="btn" type="submit">Request to join</button>
    </form>
    <p class="note">An administrator will review your request. <a href="login.html">Already registered?</a></p>
  </section>
</main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
